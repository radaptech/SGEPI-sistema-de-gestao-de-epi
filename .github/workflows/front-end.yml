name: Front-end

# Monorepo: só roda quando o front (ou este arquivo) muda.
on:
  push:
    branches: [main, dev, homologacao]
    paths: ['SGEPI-FRONT-END/**', '.github/workflows/front-end.yml']
  pull_request:
    paths: ['SGEPI-FRONT-END/**', '.github/workflows/front-end.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SGEPI-FRONT-END
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: SGEPI-FRONT-END/package-lock.json

      - run: npm ci

      - name: build
        # CI=true (padrão do Actions): warning de lint quebra o build
        run: npm run build

      - name: testes
        run: npm test -- --watchAll=false
