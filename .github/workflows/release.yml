name: Release

# Produção: só a main gera imagem.
# testes (back, front, e2e) → versão nova → imagem no Docker Hub → tag vX.Y.Z + GitHub Release.
# Uma imagem só (Dockerfile da raiz): o Go serve a API em /api e o front no resto.
# O deploy no Railway é manual: troca a tag da imagem no serviço (ver "Deploy" no README).
#
# Versão: a primeira é 1.0.0; depois cada push na main sobe o patch (1.0.1, 1.0.2...).
# Um commit com #minor ou #major no texto, desde a última tag, sobe a parte correspondente.
on:
  push:
    branches: [main]
  workflow_dispatch:

# dois pushes seguidos não podem calcular a mesma versão
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  back-end:
    uses: ./.github/workflows/back-end.yml
  front-end:
    uses: ./.github/workflows/front-end.yml
  e2e:
    uses: ./.github/workflows/e2e.yml

  publicar:
    needs: [back-end, front-end, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag e o release
    env:
      IMAGEM: ${{ vars.DOCKERHUB_USUARIO }}/sgepi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa das tags e do histórico para calcular a versão

      - name: Confere a configuração
        run: |
          faltando=""
          [ -n "${{ vars.DOCKERHUB_USUARIO }}" ] || faltando="$faltando variável DOCKERHUB_USUARIO;"
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] || faltando="$faltando secret DOCKERHUB_TOKEN;"
          if [ -n "$faltando" ]; then
            echo "::error::Configure em Settings > Secrets and variables > Actions:$faltando"
            exit 1
          fi

      - name: Calcula a versão
        id: versao
        run: |
          # rodar de novo no mesmo commit reaproveita a versão em vez de pular uma
          atual=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)
          ultima=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$atual" ]; then
            nova=${atual#v}
          elif [ -z "$ultima" ]; then
            nova=1.0.0
          else
            IFS=. read -r maior menor patch <<< "${ultima#v}"
            mensagens=$(git log "$ultima"..HEAD --format=%B)
            if grep -q '#major' <<< "$mensagens"; then
              maior=$((maior + 1)); menor=0; patch=0
            elif grep -q '#minor' <<< "$mensagens"; then
              menor=$((menor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            nova=$maior.$menor.$patch
          fi
          echo "versao=$nova" >> "$GITHUB_OUTPUT"
          echo "Versão: $nova (última tag: ${ultima:-nenhuma})" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSAO=${{ steps.versao.outputs.versao }}
          tags: |
            ${{ env.IMAGEM }}:${{ steps.versao.outputs.versao }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # a tag só existe depois que a imagem subiu: toda tag tem imagem
      - name: Tag e release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then
            git tag "v$VERSAO"
            git push origin "v$VERSAO"
          fi
          gh release view "v$VERSAO" >/dev/null 2>&1 || gh release create "v$VERSAO" --title "v$VERSAO" --generate-notes \
            --notes "Imagem: \`$IMAGEM:$VERSAO\`"
